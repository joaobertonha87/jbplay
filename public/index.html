<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<title>JB Play — Treinos & Scout</title>
<style>
:root{
  --bg:#071019;
  --panel:#0d1b28;
  --panel2:#0a141e;
  --line:rgba(255,255,255,.10);
  --text:#f4f7fa;
  --muted:#9ba9b4;
  --lime:#c9ff28;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#071019;color:var(--text)}
body{
  background:
    radial-gradient(circle at 18% 0%,rgba(201,255,40,.05),transparent 24%),
    linear-gradient(160deg,#071019 0%,#0a1118 56%,#070c12 100%);
}
.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;
  padding:14px 12px;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(15,29,42,.97),rgba(7,14,21,.98));
  display:flex;flex-direction:column;gap:12px;z-index:20
}
.logo{
  height:145px;border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(180deg,rgba(15,28,39,.96),rgba(7,14,20,.98));
  display:grid;place-items:center;overflow:hidden
}
.logo img{width:88%;max-height:125px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(201,255,40,.16))}
.module-title{font-size:10px;letter-spacing:.13em;color:#7f8d98;padding:4px 8px 0}
.nav{display:grid;gap:7px}
.nav button{
  border:1px solid transparent;background:transparent;color:#eef3f6;
  border-radius:13px;padding:12px 13px;font-weight:850;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:11px
}
.nav button:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.nav button.active{background:linear-gradient(135deg,#d7ff22,#b4eb17);color:#071018;box-shadow:0 8px 24px rgba(201,255,40,.18)}
.nav .icon{font-size:19px;width:24px;text-align:center}
.spacer{flex:1}
.quote{border:1px solid var(--line);border-radius:17px;padding:13px;background:rgba(11,21,30,.8)}
.quote small{display:block;color:#8d9ba6;margin-bottom:5px}.quote b{font-size:12px;color:var(--lime);line-height:1.4}
.main{min-width:0;padding:10px 12px 16px}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.search{min-width:340px;max-width:480px;height:40px;border:1px solid var(--line);border-radius:14px;background:rgba(13,25,36,.82);display:flex;align-items:center;gap:9px;padding:0 14px;color:#84939f;font-size:12px}
.profile{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#fff,#c9ff28);display:grid;place-items:center;color:#081016;font-weight:950}
.profile small{display:block;color:#94a2ae;margin-top:2px}
.modulebar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:10px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(180deg,rgba(14,27,39,.90),rgba(8,17,25,.92))
}
.modulebar strong{font-size:14px}.modulebar span{font-size:10px;color:var(--muted)}
.switch{display:flex;gap:6px;background:#09141d;border:1px solid var(--line);padding:4px;border-radius:12px}
.switch button{border:0;border-radius:9px;background:transparent;color:#aebbc5;padding:8px 12px;font-weight:850;cursor:pointer}
.switch button.active{background:var(--lime);color:#071018}
.framewrap{position:relative;min-height:calc(100vh - 92px)}
iframe{
  width:100%;height:calc(100vh - 92px);border:0;border-radius:18px;background:transparent;
  display:none
}
iframe.active{display:block}
@media(max-width:900px){
  .shell{grid-template-columns:78px 1fr}
  .sidebar{padding:9px 7px}.logo{height:72px}.logo img{width:68px}
  .nav button{justify-content:center;padding:11px 8px}.nav button span:last-child,.module-title,.quote{display:none}
}
@media(max-width:650px){
  .shell{display:block}
  .sidebar{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:7px;border-right:0;border-bottom:1px solid var(--line)}
  .logo{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:50px}.spacer,.quote{display:none}
  .main{padding:7px}.topbar{display:none}.modulebar{position:sticky;top:62px;z-index:10}
  iframe{height:calc(100vh - 82px)}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="logo"><img src="jb-logo-lime.png" alt="João Bertonha Beach Tennis"></div>
    <div class="module-title">JB PLAY</div>
    <nav class="nav">
      <button class="active" data-module="treino"><span class="icon">▶</span><span>Treinos</span></button>
      <button data-module="scout"><span class="icon">▦</span><span>Scout</span></button>
    </nav>
    <div class="module-title">ACESSO RÁPIDO</div>
    <nav class="nav">
      <button data-open="treino"><span class="icon">◫</span><span>Quadra / IA</span></button>
      <button data-open="scout"><span class="icon">◎</span><span>Estatísticas</span></button>
    </nav>
    <div class="spacer"></div>
    <div class="quote"><small>JOÃO BERTONHA</small><b>Foco • Evolução • Resultados</b></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="search">⌕ <span>Buscar treino, scout ou fundamento...</span></div>
      <div class="profile"><div class="avatar">JB</div><div><b>João Bertonha</b><small>Treinador</small></div></div>
    </header>

    <section class="modulebar">
      <div><strong id="moduleName">Gerador de Treinos</strong><span id="moduleDesc">Quadra animada, IA, movimentação e exportação.</span></div>
      <div class="switch">
        <button class="active" data-module="treino">Treinos</button>
        <button data-module="scout">Scout</button>
      </div>
    </section>

    <div class="framewrap">
      <iframe id="frameTreino" class="active" src="treino.html" title="JB Play Treinos"></iframe>
      <iframe id="frameScout" src="scout.html" title="JB Play Scout"></iframe>
    </div>
  </main>
</div>

<script>
const frames={treino:document.getElementById('frameTreino'),scout:document.getElementById('frameScout')};
const nameEl=document.getElementById('moduleName'),descEl=document.getElementById('moduleDesc');
function openModule(name){
  Object.entries(frames).forEach(([k,f])=>f.classList.toggle('active',k===name));
  document.querySelectorAll('[data-module]').forEach(b=>b.classList.toggle('active',b.dataset.module===name));
  if(name==='scout'){
    nameEl.textContent='JB Scout Pro';
    descEl.textContent='Estatísticas, placar, fundamentos, mapas e relatórios.';
  }else{
    nameEl.textContent='Gerador de Treinos';
    descEl.textContent='Quadra animada, IA, movimentação e exportação.';
  }
  try{localStorage.setItem('jbplay-module',name)}catch(e){}
}
document.querySelectorAll('[data-module]').forEach(b=>b.addEventListener('click',()=>openModule(b.dataset.module)));
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openModule(b.dataset.open)));
try{openModule(localStorage.getItem('jbplay-module')||'treino')}catch(e){openModule('treino')}
</script>
</body>
</html>
